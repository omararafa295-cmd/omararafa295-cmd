  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111A25" stop-opacity=".90"/><stop offset="1" stop-color="#0D151F" stop-opacity=".92"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8BCBFF"/><stop offset=".52" stop-color="#58A6FF"/><stop offset="1" stop-color="#2F81F7"/></linearGradient>
