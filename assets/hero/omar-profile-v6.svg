  <radialGradient id="halo"><stop stop-color="#58A6FF" stop-opacity=".12"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#58A6FF" stroke-opacity=".045"/></pattern>
  <filter id="nameGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono,.ascii,.tiny,.key,.value,.sec,.foot{font-family:'Courier New',Consolas,monospace}
    .ascii{font-size:5.9px;letter-spacing:-.12px;fill:url(#ascii)}
    .tiny{font-size:11px;letter-spacing:1.9px;fill:#8B949E}
    .key{font-size:15px;font-weight:700;fill:#58A6FF}
    .value{font-size:15px;font-weight:700;fill:#F0F6FC}
    .sec{font-size:11px;font-weight:700;letter-spacing:2.2px;fill:#8B949E}
    .foot{font-size:11px;letter-spacing:1.8px;fill:#8B949E}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan{0%{transform:translateY(-135px);opacity:0}15%,85%{opacity:.72}100%{transform:translateY(150px);opacity:0}}
    .pulse{animation:pulse 2.2s ease-in-out infinite}.scan{animation:scan 5.8s linear infinite}
  </style>
</defs>
