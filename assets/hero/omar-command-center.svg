<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">Omar Arafa — Engineering Command Center</title>
  <desc id="description">Premium developer profile hero showing Omar Arafa's full-stack and systems engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070B12"/><stop offset=".48" stop-color="#0B111B"/><stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111A26" stop-opacity=".94"/><stop offset="1" stop-color="#0B121C" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B8E1FF"/><stop offset=".35" stop-color="#69B7FF"/><stop offset=".7" stop-color="#2F81F7"/><stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".48" stop-color="#58A6FF"/><stop offset="1" stop-color="#7C5CFC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#B8E1FF"/><stop offset=".18" stop-color="#58A6FF"/><stop offset=".54" stop-color="#1F6FEB" stop-opacity=".58"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient">
      <stop stop-color="#1F6FEB" stop-opacity=".22"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#58A6FF" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'Courier New',Consolas,monospace}
      .chip{fill:#0D1723;stroke:#24364C}.node{fill:#0C1621;stroke:#2F81F7;stroke-opacity:.72}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}
      @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-90}}
      .orbitA{transform-origin:1000px 309px;animation:spin 26s linear infinite}.orbitB{transform-origin:1000px 309px;animation:reverse 19s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}.flow{animation:dash 5s linear infinite}
      @media(prefers-reduced-motion:reduce){.orbitA,.orbitB,.pulse,.flow{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="620" rx="28" fill="url(#bg)"/>
  <rect x="5" y="5" width="1270" height="610" rx="24" fill="none" stroke="#263343"/>
  <rect x="1" y="1" width="1278" height="2" rx="1" fill="url(#line)"/>
  <rect width="1280" height="620" rx="28" fill="url(#grid)"/>
  <ellipse cx="1010" cy="300" rx="350" ry="305" fill="url(#ambient)"/>

  <g class="mono" font-size="12" letter-spacing="1.7">
    <circle cx="34" cy="33" r="5" fill="#FF7B72"/><circle cx="53" cy="33" r="5" fill="#D29922"/><circle cx="72" cy="33" r="5" fill="#3FB950"/>
    <text x="94" y="37" fill="#8B949E">OMAR.SYSTEMS / ENGINEERING PROFILE</text>
    <circle cx="1135" cy="33" r="4.5" fill="#3FB950" class="pulse"/>
    <text x="1149" y="37" fill="#7EE787" font-weight="700">ONLINE</text>
  </g>
  <line x1="22" y1="58" x2="1258" y2="58" stroke="#202B39"/>

  <g transform="translate(54 102)">
    <text class="mono" x="0" y="0" font-size="13" font-weight="700" letter-spacing="2.8" fill="#58A6FF">FULL STACK × SYSTEMS ENGINEERING</text>
    <text class="sans" x="-2" y="76" font-size="64" font-weight="850" letter-spacing="2" fill="#F0F6FC">OMAR</text>
    <text class="sans" x="-2" y="140" font-size="64" font-weight="850" letter-spacing="2" fill="url(#blue)" filter="url(#softGlow)">ARAFA</text>
    <rect x="0" y="166" width="596" height="2" fill="url(#line)"/>
    <text class="sans" x="0" y="205" font-size="20" font-weight="650" fill="#D6E2EE">Full Stack PHP Developer</text>
    <text class="sans" x="0" y="238" font-size="16" fill="#8B949E">Building scalable web systems from backend logic</text>
    <text class="sans" x="0" y="264" font-size="16" fill="#8B949E">to responsive interfaces and connected hardware.</text>

    <g transform="translate(0 296)" class="mono" font-size="12" font-weight="700" letter-spacing=".7">
      <rect class="chip" width="112" height="38" rx="11"/><circle cx="19" cy="19" r="4" fill="#FF2D20"/><text x="32" y="23" fill="#E6EDF3">LARAVEL</text>
      <g transform="translate(124 0)"><rect class="chip" width="101" height="38" rx="11"/><circle cx="19" cy="19" r="4" fill="#58A6FF"/><text x="32" y="23" fill="#E6EDF3">MYSQL</text></g>
      <g transform="translate(237 0)"><rect class="chip" width="128" height="38" rx="11"/><circle cx="19" cy="19" r="4" fill="#7C5CFC"/><text x="32" y="23" fill="#E6EDF3">REST APIs</text></g>
      <g transform="translate(377 0)"><rect class="chip" width="94" height="38" rx="11"/><circle cx="19" cy="19" r="4" fill="#3FB950"/><text x="32" y="23" fill="#E6EDF3">IoT</text></g>
    </g>

    <g transform="translate(0 366)">
      <rect width="596" height="72" rx="14" fill="url(#panel)" stroke="#243244"/>
      <g class="mono" font-size="11" letter-spacing="1.2" fill="#8B949E">
        <text x="22" y="25">CURRENT FOCUS</text><text x="218" y="25">ENGINEERING CORE</text><text x="430" y="25">LOCATION</text>
      </g>
      <g class="sans" font-size="14" font-weight="700" fill="#E6EDF3">
        <text x="22" y="51">Scalable Backends</text><text x="218" y="51">Computer &amp; Systems</text><text x="430" y="51">Egypt</text>
      </g>
    </g>
  </g>

  <g>
    <rect x="702" y="84" width="528" height="460" rx="24" fill="url(#panel)" stroke="#2A3A4D"/>
    <text class="mono" x="730" y="116" font-size="12" font-weight="700" letter-spacing="2.1" fill="#8B949E">SYSTEM ARCHITECTURE / LIVE</text>
    <circle cx="1198" cy="111" r="4" fill="#58A6FF" class="pulse"/>
    <line x1="730" y1="132" x2="1202" y2="132" stroke="#202D3C"/>

    <g fill="none" stroke="#58A6FF">
      <ellipse class="orbitA" cx="1000" cy="309" rx="181" ry="116" stroke-opacity=".22" stroke-dasharray="8 13"/>
      <ellipse class="orbitB" cx="1000" cy="309" rx="142" ry="184" stroke-opacity=".18" stroke-dasharray="28 18"/>
      <circle cx="1000" cy="309" r="116" stroke-opacity=".12"/>
      <circle cx="1000" cy="309" r="82" stroke-opacity=".28" stroke-dasharray="3 8" class="flow"/>
    </g>

    <g stroke="#58A6FF" stroke-opacity=".32" stroke-dasharray="5 7" class="flow">
      <line x1="1000" y1="309" x2="812" y2="216"/><line x1="1000" y1="309" x2="1178" y2="216"/>
      <line x1="1000" y1="309" x2="812" y2="410"/><line x1="1000" y1="309" x2="1178" y2="410"/>
    </g>

    <circle cx="1000" cy="309" r="105" fill="url(#core)" opacity=".5"/>
    <circle cx="1000" cy="309" r="64" fill="#091522" stroke="#69B7FF" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M972 288l-22 21 22 21M1028 288l22 21-22 21M1011 276l-23 66" fill="none" stroke="#B8E1FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="1000" y="389" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.2" fill="#79C0FF">SYSTEM CORE</text>

    <g class="mono" font-size="11" font-weight="700" letter-spacing="1">
      <g transform="translate(742 192)"><rect class="node" width="140" height="50" rx="13"/><circle cx="19" cy="25" r="5" fill="#FF2D20"/><text x="34" y="22" fill="#F0F6FC">BACKEND</text><text x="34" y="37" fill="#8B949E" font-size="9">PHP / LARAVEL</text></g>
      <g transform="translate(1112 192)"><rect class="node" width="96" height="50" rx="13"/><circle cx="17" cy="25" r="5" fill="#58A6FF"/><text x="30" y="22" fill="#F0F6FC">DATA</text><text x="30" y="37" fill="#8B949E" font-size="9">MYSQL</text></g>
      <g transform="translate(742 386)"><rect class="node" width="140" height="50" rx="13"/><circle cx="19" cy="25" r="5" fill="#7C5CFC"/><text x="34" y="22" fill="#F0F6FC">INTERFACE</text><text x="34" y="37" fill="#8B949E" font-size="9">JS / BOOTSTRAP</text></g>
      <g transform="translate(1092 386)"><rect class="node" width="116" height="50" rx="13"/><circle cx="18" cy="25" r="5" fill="#3FB950"/><text x="32" y="22" fill="#F0F6FC">EMBEDDED</text><text x="32" y="37" fill="#8B949E" font-size="9">MCU / IOT</text></g>
    </g>
  </g>

  <g transform="translate(22 568)">
    <rect width="1236" height="34" rx="10" fill="#0A121C" stroke="#202D3C"/>
    <text class="mono" x="18" y="22" font-size="11" letter-spacing="1.4" fill="#8B949E">omar@developer:~$</text>
    <text class="mono" x="169" y="22" font-size="11" font-weight="700" letter-spacing="1.4" fill="#79C0FF">BUILD • LEARN • SHIP</text>
    <text class="mono" x="1214" y="22" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#8B949E">ZAGAZIG UNIVERSITY / 2027</text>
  </g>
</svg>
