  <style>
    .mono,.ascii,.pt,.term,.live,.head,.row,.foot,.brand,.sub{font-family:'Courier New',Consolas,monospace}
    .ascii{font-size:6.1px;letter-spacing:-.36px;fill:url(#ascii)}
    .pt{font-size:11px;letter-spacing:2px;fill:#F0F6FC;opacity:.78}
    .term{font-size:11px;fill:#8B949E}
    .brand{font-size:21px;font-weight:700;fill:#F0F6FC;letter-spacing:2.4px}
    .sub{font-size:9px;fill:#58A6FF;letter-spacing:1.6px}
    .live{font-size:10px;fill:#58A6FF;letter-spacing:1.2px}
    .head{font-size:16px;font-weight:700;fill:#F0F6FC}
    .row{font-size:14px;fill:#F0F6FC}
    .key{font-weight:700;fill:#58A6FF}
    .foot{font-size:11px;fill:#8B949E;letter-spacing:1.4px}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} .pulse{animation:pulse 2.4s ease-in-out infinite}
  </style>
