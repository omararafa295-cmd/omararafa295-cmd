<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B111B"/>
      <stop offset="1" stop-color="#07101D"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="100" y1="0" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#58A6FF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #8B949E; }
      .key { font-size: 16px; font-weight: 700; fill: #58A6FF; }
      .value { font-size: 16px; font-weight: 600; fill: #E6EDF3; }
      .muted { fill: #8B949E; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .cursor { animation: blink 1.05s step-end infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="618" rx="24" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="584" rx="18" fill="url(#grid)"/>

  <!-- top bar -->
  <rect x="22" y="22" width="1156" height="56" rx="14" fill="#0F1620" stroke="#21262D"/>
  <circle cx="52" cy="50" r="6" fill="#FF7B72"/>
  <circle cx="74" cy="50" r="6" fill="#D29922"/>
  <circle cx="96" cy="50" r="6" fill="#3FB950"/>
  <text x="122" y="56" class="mono" font-size="14" fill="#8B949E">omar@developer ~ % ./profile</text>
  <circle cx="1032" cy="50" r="5" fill="#58A6FF" class="pulse" filter="url(#glow)"/>
  <text x="1048" y="55" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#58A6FF">BUILDING</text>

  <!-- left portrait/code panel -->
  <rect x="38" y="98" width="390" height="426" rx="16" fill="#0D131C" fill-opacity="0.9" stroke="#30363D"/>
  <text x="58" y="126" class="mono label">PORTRAIT / OMAR</text>
  <line x1="58" y1="140" x2="408" y2="140" stroke="#21262D"/>

  <g opacity="0.92">
    <text x="84" y="215" class="mono" font-size="18" fill="#30363D">01001111 01001101 01000001 01010010</text>
    <text x="78" y="248" class="mono" font-size="18" fill="#30363D">&lt;?php  class  OmarArafa  {</text>
    <text x="78" y="281" class="mono" font-size="18" fill="#30363D">  use  ProblemSolving;</text>
    <text x="78" y="314" class="mono" font-size="18" fill="#30363D">  public $focus = "BUILD";</text>
    <text x="78" y="347" class="mono" font-size="18" fill="#30363D">}</text>
  </g>

  <text x="86" y="345" class="mono" font-size="116" font-weight="800" fill="#58A6FF" fill-opacity="0.10">OA</text>
  <text x="80" y="342" class="mono" font-size="116" font-weight="800" fill="none" stroke="#58A6FF" stroke-opacity="0.78" stroke-width="2">OA</text>
  <text x="80" y="376" class="mono" font-size="15" font-weight="700" fill="#E6EDF3">OMAR ARAFA</text>
  <text x="80" y="400" class="mono" font-size="13" fill="#8B949E">SOFTWARE ENGINEER / SYSTEMS THINKER</text>

  <rect x="62" y="440" width="342" height="58" rx="10" fill="#111A26" stroke="#1F6FEB" stroke-opacity="0.45"/>
  <text x="80" y="465" class="mono" font-size="12" fill="#8B949E">CURRENT MODE</text>
  <text x="80" y="487" class="mono" font-size="14" font-weight="700" fill="#58A6FF">FULL-STACK + EMBEDDED SYSTEMS<tspan class="cursor">_</tspan></text>

  <!-- right profile panel -->
  <rect x="448" y="98" width="714" height="426" rx="16" fill="#0D131C" fill-opacity="0.92" stroke="#30363D"/>
  <text x="470" y="126" class="mono label">PROFILE / ENGINEER</text>
  <line x1="470" y1="140" x2="1140" y2="140" stroke="#21262D"/>

  <text x="470" y="172" class="mono" font-size="14" font-weight="700" fill="#E6EDF3">omar@developer</text>

  <text x="470" y="204" class="mono key">Name:</text>
  <text x="612" y="204" class="mono value">Omar Arafa</text>
  <text x="470" y="230" class="mono key">Major:</text>
  <text x="612" y="230" class="mono value">Computer &amp; Systems Engineering</text>
  <text x="470" y="256" class="mono key">University:</text>
  <text x="612" y="256" class="mono value">Zagazig University</text>
  <text x="470" y="282" class="mono key">Year:</text>
  <text x="612" y="282" class="mono value">3rd Academic Year</text>

  <line x1="470" y1="306" x2="1140" y2="306" stroke="#21262D"/>
  <text x="470" y="332" class="mono label">BUILD.FOCUS</text>
  <text x="470" y="362" class="mono key">Backend:</text>
  <text x="612" y="362" class="mono value">PHP, Laravel, RESTful APIs, MySQL</text>
  <text x="470" y="388" class="mono key">Frontend:</text>
  <text x="612" y="388" class="mono value">HTML, CSS, JavaScript, Bootstrap</text>
  <text x="470" y="414" class="mono key">Architecture:</text>
  <text x="612" y="414" class="mono value">MVC, Service-Oriented, RESTful APIs</text>
  <text x="470" y="440" class="mono key">Hardware:</text>
  <text x="612" y="440" class="mono value">PID, Sensors, Microcontrollers, IoT</text>

  <line x1="470" y1="464" x2="1140" y2="464" stroke="#21262D"/>
  <text x="470" y="490" class="mono" font-size="12" letter-spacing="1.4" fill="#8B949E">BRIDGING SOFTWARE &amp; HARDWARE • BUILDING SCALABLE SYSTEMS</text>

  <!-- bottom strip -->
  <rect x="38" y="544" width="1124" height="44" rx="11" fill="#0F1620" stroke="#21262D"/>
  <text x="600" y="571" text-anchor="middle" class="mono" font-size="12" font-weight="700" letter-spacing="2.1" fill="#8B949E">PHP  /  LARAVEL  /  MYSQL  /  JAVASCRIPT  /  EMBEDDED SYSTEMS  /  IOT</text>
  <rect x="38" y="544" width="1124" height="2" rx="1" fill="url(#blueGlow)"/>
</svg>
