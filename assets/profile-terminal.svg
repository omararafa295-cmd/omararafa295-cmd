<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0A111C"/>
      <stop offset="1" stop-color="#06101D"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="110" y1="0" x2="1090" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="portraitShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="portraitTone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.28 0.28 0.28 0 0.02  0.37 0.37 0.37 0 0.08  0.52 0.52 0.52 0 0.18  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.1" exponent="0.9" offset="0"/>
        <feFuncG type="gamma" amplitude="1.05" exponent="0.9" offset="0"/>
        <feFuncB type="gamma" amplitude="1.25" exponent="0.86" offset="0"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="portraitClip">
      <rect x="70" y="222" width="326" height="320" rx="16"/>
    </clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#58A6FF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="0.7"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #8B949E; }
      .key { font-size: 16px; font-weight: 700; fill: #58A6FF; }
      .value { font-size: 16px; font-weight: 600; fill: #E6EDF3; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .cursor { animation: blink 1.05s step-end infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="24" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="724" rx="18" fill="url(#grid)"/>

  <!-- terminal chrome -->
  <rect x="22" y="22" width="1156" height="56" rx="14" fill="#0F1620" stroke="#21262D"/>
  <circle cx="52" cy="50" r="6" fill="#FF7B72"/>
  <circle cx="74" cy="50" r="6" fill="#D29922"/>
  <circle cx="96" cy="50" r="6" fill="#3FB950"/>
  <text x="122" y="56" class="mono" font-size="14" fill="#8B949E">omar@developer ~ % ./profile</text>
  <circle cx="1032" cy="50" r="5" fill="#58A6FF" class="pulse" filter="url(#glow)"/>
  <text x="1048" y="55" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#58A6FF">BUILDING</text>

  <!-- identity -->
  <text x="600" y="120" text-anchor="middle" class="mono" font-size="42" font-weight="800" letter-spacing="2" fill="#E6EDF3">OMAR ARAFA</text>
  <text x="600" y="148" text-anchor="middle" class="mono" font-size="13" font-weight="700" letter-spacing="3.2" fill="#58A6FF">FULL-STACK PHP DEVELOPER  •  LARAVEL  •  SYSTEMS ENGINEERING</text>

  <!-- left portrait panel -->
  <rect x="38" y="176" width="390" height="476" rx="16" fill="#0D131C" fill-opacity="0.93" stroke="#30363D"/>
  <text x="58" y="205" class="mono label">PORTRAIT / OMAR</text>
  <line x1="58" y1="216" x2="408" y2="216" stroke="#21262D"/>

  <rect x="70" y="222" width="326" height="320" rx="16" fill="#08101A" stroke="#1F6FEB" stroke-opacity="0.55"/>
  <image href="https://avatars.githubusercontent.com/u/228095676?v=4" x="70" y="222" width="326" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" filter="url(#portraitTone)"/>
  <rect x="70" y="222" width="326" height="320" rx="16" fill="url(#portraitShade)"/>
  <rect x="70" y="222" width="326" height="320" rx="16" fill="url(#scan)" opacity="0.85"/>
  <path d="M84 244H116M84 244V276M382 244H350M382 244V276M84 520H116M84 520V488M382 520H350M382 520V488" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
  <text x="88" y="565" class="mono" font-size="15" font-weight="700" fill="#E6EDF3">OMAR ARAFA</text>
  <text x="88" y="588" class="mono" font-size="12" fill="#8B949E">SOFTWARE ENGINEER / SYSTEMS THINKER</text>
  <rect x="70" y="607" width="326" height="28" rx="7" fill="#111A26" stroke="#1F6FEB" stroke-opacity="0.45"/>
  <text x="88" y="626" class="mono" font-size="12" font-weight="700" fill="#58A6FF">FULL-STACK + EMBEDDED SYSTEMS<tspan class="cursor">_</tspan></text>

  <!-- right profile panel -->
  <rect x="448" y="176" width="714" height="476" rx="16" fill="#0D131C" fill-opacity="0.93" stroke="#30363D"/>
  <text x="470" y="205" class="mono label">PROFILE / ENGINEER</text>
  <line x1="470" y1="216" x2="1140" y2="216" stroke="#21262D"/>
  <text x="470" y="249" class="mono" font-size="14" font-weight="700" fill="#E6EDF3">omar@developer</text>

  <text x="470" y="284" class="mono key">Name:</text>
  <text x="612" y="284" class="mono value">Omar Arafa</text>
  <text x="470" y="312" class="mono key">Major:</text>
  <text x="612" y="312" class="mono value">Computer &amp; Systems Engineering</text>
  <text x="470" y="340" class="mono key">University:</text>
  <text x="612" y="340" class="mono value">Zagazig University</text>
  <text x="470" y="368" class="mono key">Year:</text>
  <text x="612" y="368" class="mono value">3rd Academic Year</text>

  <line x1="470" y1="392" x2="1140" y2="392" stroke="#21262D"/>
  <text x="470" y="420" class="mono label">BUILD.FOCUS</text>
  <text x="470" y="452" class="mono key">Backend:</text>
  <text x="612" y="452" class="mono value">PHP, Laravel, RESTful APIs, MySQL</text>
  <text x="470" y="480" class="mono key">Frontend:</text>
  <text x="612" y="480" class="mono value">HTML, CSS, JavaScript, Bootstrap</text>
