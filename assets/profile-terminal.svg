  <text x="612" y="508" class="mono value">MVC, Service-Oriented, RESTful APIs</text>
  <text x="470" y="536" class="mono key">Hardware:</text>
  <text x="612" y="536" class="mono value">PID, Sensors, Microcontrollers, IoT</text>
  <text x="470" y="564" class="mono key">Toolchain:</text>
  <text x="612" y="564" class="mono value">Git, GitHub, VS Code, Arduino</text>

  <line x1="470" y1="590" x2="1140" y2="590" stroke="#21262D"/>
  <text x="470" y="620" class="mono" font-size="12" letter-spacing="1.3" fill="#8B949E">BRIDGING SOFTWARE &amp; HARDWARE  •  BUILDING SCALABLE SYSTEMS</text>

  <!-- footer strip -->
  <rect x="38" y="676" width="1124" height="48" rx="11" fill="#0F1620" stroke="#21262D"/>
  <rect x="38" y="676" width="1124" height="2" rx="1" fill="url(#blueGlow)"/>
  <text x="600" y="706" text-anchor="middle" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#8B949E">PHP  /  LARAVEL  /  MYSQL  /  JAVASCRIPT  /  EMBEDDED SYSTEMS  /  IOT</text>
</svg>
